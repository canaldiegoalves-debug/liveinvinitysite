<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCam Infinity — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(18, 20, 29, 0.95);
      --border: rgba(255, 204, 0, 0.35);
      --red: #ff1717;
      --gold: #ffd000;
      --text: #f0f2f5;
      --dim: #9aa0a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 20px 18px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ff1717, #ffd000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 16px;
    }
    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #03050a;
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      text-align: center;
      outline: none;
      font-family: monospace;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #ff1717, #e10000);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 23, 23, 0.45);
      transition: all 0.2s ease;
    }
    button:hover { transform: scale(1.02); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #msg {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      min-height: 16px;
    }
    .status-card {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #00e676;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-sair {
      margin-top: 10px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--dim);
      font-size: 10px;
      padding: 6px;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div id="loginSection">
    <div class="brand-title">📹 LIVECAM INFINITY</div>
    <div class="subtitle">Insira sua chave de acesso para liberar a Câmera HD</div>

    <div class="input-group">
      <label for="chaveInput">Chave de Licença</label>
      <input id="chaveInput" type="text" placeholder="LIVECAM-PREMIUM-XXXXX..." autocomplete="off" spellcheck="false">
    </div>

    <button id="btnEntrar">🔐 Entrar no LiveCam HD</button>
    <div id="msg"></div>
  </div>

  <div id="loggedSection" style="display: none;">
    <div class="brand-title">📹 LIVECAM INFINITY</div>
    <div class="subtitle">Licença Ativa & Autenticada</div>
    <div class="status-card">✅ Câmera HD Liberada no TikTok Live</div>
    <button id="btnSair" class="btn-sair">Sair / Trocar Chave</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
